name: publish

# Publishes to npm when a GitHub release is published (tag like v0.0.1).
# Uses npm trusted publishing (OIDC), so no npm token is stored in GitHub.
# Set it up once on npmjs.com: package settings > Trusted publishing >
# GitHub Actions, repository tmokmss/agent-code-sandbox, workflow publish.yml.
# npm can only set this up for a package that already exists, so for the very
# first release, add an npm token as the NPM_TOKEN secret (remove it afterwards).

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
