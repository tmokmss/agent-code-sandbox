# Release pipeline driven by semantic-release.
#
# Flow:
#   1. Every push to main runs semantic-release. It scans commits since
#      the last v* tag.
#   2. Bump type is derived from those commit messages (see .releaserc.json):
#        - BREAKING CHANGE → major
#        - feat: → minor
#        - any other type (fix/refactor/chore/docs/...) → patch
#   3. semantic-release bumps package.json *in CI only* (not committed back),
#      publishes to npm with provenance, then creates the git tag and the
#      GitHub Release with generated notes.
#
# npm auth: trusted publishing (OIDC), set up on npmjs.com for workflow
# release.yml. No npm token is stored in GitHub.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node 24 ships an npm that supports trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # semantic-release starts at 1.0.0 when there is no tag. Start at 0.0.x instead:
      # until the first v* tag exists, mark the previous main commit as v0.0.0.
      # The tag is local to this job and never pushed.
      - name: Start versions at 0.0.x
        run: |
          if [ -z "$(git tag -l 'v*')" ]; then
            git tag v0.0.0 "${{ github.event.before || 'HEAD^' }}"
          fi

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
